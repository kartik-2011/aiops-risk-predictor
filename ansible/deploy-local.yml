---
- name: Deploy AIOps Incident Risk Predictor locally with Docker
  hosts: local_demo
  connection: local
  gather_facts: false

  vars:
    app_name: aiops-risk-predictor-local
    app_port: 8001
    app_env: local
    docker_image: "{{ app_name }}:latest"
    project_root: "{{ playbook_dir }}/.."

  tasks:
    - name: Build local Docker image
      community.docker.docker_image:
        name: "{{ app_name }}"
        tag: latest
        source: build
        force_source: true
        build:
          path: "{{ project_root }}"

    - name: Run local application container
      community.docker.docker_container:
        name: "{{ app_name }}"
        image: "{{ docker_image }}"
        state: started
        recreate: true
        restart_policy: unless-stopped
        env:
          APP_ENV: "{{ app_env }}"
        labels:
          co.elastic.logs/enabled: "true"
          co.elastic.logs/json.keys_under_root: "true"
          co.elastic.logs/json.add_error_key: "true"
        published_ports:
          - "{{ app_port }}:8000"

    - name: Wait for local health endpoint
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ app_port }}/health"
        return_content: true
      register: health_check
      retries: 10
      delay: 3
      until: health_check.status == 200

    - name: Show local application URL
      ansible.builtin.debug:
        msg: "AIOps Incident Risk Predictor is running on http://127.0.0.1:{{ app_port }}"
